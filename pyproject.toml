[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-dynamic-admin-columns"
version = "0.4.5"
description = "User-controllable, in-database list_display for Django admin: enable, disable and reorder columns at runtime."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Michał Pasternak", email = "michal.dtz@gmail.com" },
]
keywords = [
    "django",
    "django-admin",
    "list_display",
    "columns",
    "dynamic",
    "admin",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=5.2",
    "django-admin-sortable2>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-django>=4.5",
    "django-webtest>=1.9",
    "pre-commit>=3",
    "ruff>=0.5",
    "model-bakery>=1.17",
]
# NB: the bundled dev stack for ``example/`` and ``example_grappelli/``
# (``django-run-site``, ``django-dev-helpers``, ``psycopg``,
# ``django-grappelli``) is intentionally *not* an optional-dependency
# group here. ``django-run-site`` is currently only published from a
# GitHub tag and PyPI rejects direct-reference URLs in published
# metadata; moving the example wiring to per-folder
# ``requirements-dev.txt`` files keeps the published package clean and
# pip-installable everywhere while still letting humans bootstrap the
# demos with a one-liner. See ``example/requirements-dev.txt`` and
# ``example_grappelli/requirements-dev.txt``.

[project.urls]
Homepage = "https://github.com/iplweb/django-dynamic-admin-columns"
Repository = "https://github.com/iplweb/django-dynamic-admin-columns"
Issues = "https://github.com/iplweb/django-dynamic-admin-columns/issues"
Changelog = "https://github.com/iplweb/django-dynamic-admin-columns/blob/main/CHANGELOG.md"

[tool.hatch.build]
# ``.mo`` files are git-ignored (every contributor recompiles them
# locally from ``.po``), but they MUST ship in the published wheel and
# sdist — without them, ``LocaleMiddleware`` cannot serve the Polish
# (or any other) translation catalog to end users. Hatchling honours
# ``.gitignore`` by default; ``artifacts`` is the override that
# re-includes specific patterns.
artifacts = ["*.mo"]

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_admin_columns"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dynamic_admin_columns",
    "tests",
    "example",
    "example_grappelli",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
    "src/dynamic_admin_columns/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DJ"]
"example/*" = ["DJ"]
"example_grappelli/*" = ["DJ"]

[tool.ruff.lint.isort]
known-first-party = ["dynamic_admin_columns"]
known-local-folder = [
    "tests",
    "library",
    "example_project",
    "example_grappelli_project",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
