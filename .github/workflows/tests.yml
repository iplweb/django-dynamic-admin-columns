name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        django: ["4.2", "5.0", "5.1", "5.2"]
        exclude:
          - python: "3.13"
            django: "4.2"
          - python: "3.13"
            django: "5.0"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install package and dev dependencies
        run: |
          uv venv -p ${{ matrix.python }} .venv
          uv pip install -e ".[dev]" "Django~=${{ matrix.django }}.0"

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ruff
        run: |
          uv venv -p 3.12 .venv
          uv pip install ruff

      - name: ruff check
        run: |
          source .venv/bin/activate
          ruff check .

      - name: ruff format --check
        run: |
          source .venv/bin/activate
          ruff format --check .
