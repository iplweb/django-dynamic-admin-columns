name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # ``requires-python = ">=3.11, <3.15"`` in pyproject.toml drives
        # this list. Django 5.2 LTS technically supports 3.10 too, but
        # we drop that cell because the package itself sets a 3.11 floor.
        python: ["3.11", "3.12", "3.13", "3.14"]
        django: ["5.2", "6.0"]
        exclude:
          # Django 6.0 requires Python 3.12+.
          - python: "3.11"
            django: "6.0"
          # Django 5.2 LTS does not support Python 3.14.
          - python: "3.14"
            django: "5.2"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install package and dev dependencies
        run: |
          uv venv -p ${{ matrix.python }} .venv
          uv pip install -e ".[dev]" "Django~=${{ matrix.django }}.0"

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ruff
        run: |
          uv venv -p 3.12 .venv
          uv pip install ruff

      - name: ruff check
        run: |
          source .venv/bin/activate
          ruff check .

      - name: ruff format --check
        run: |
          source .venv/bin/activate
          ruff format --check .
