# run-site configuration for the django-dynamic-admin-columns + grappelli example.
# Generated initially by `run-site init`; tuned for the demo.

[project]
name = "dynamic-admin-columns-grappelli-demo"
manage_py = "manage.py"
django_module = "example_grappelli_project"

[python]
# Pin to `uv run --no-sync python` so deps come from the parent
# package's pyproject.toml (the [example-grappelli] optional-dep group).
command = ["uv", "run", "--no-sync", "python"]

[postgres]
# Random free port; password is per-container ephemeral.
db = "dynamic_admin_columns_grappelli_demo"
user = "dynamic_admin_columns_grappelli_demo"

[redis]
# Random free port.
db = 0

[superuser]
username = "admin"
password = "admin"
email = "admin@example.com"
overwrite = true

[celery]
enabled = false

[banner]
show_db_credentials = true
